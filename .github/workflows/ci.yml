name: Full CI Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:

  # =========================
  # 1. Backend (FastAPI)
  # =========================
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Validate structure
        run: |
          echo "Backend structure:"
          ls -la

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (optional but recommended)
        run: |
          pip install flake8
          flake8 . || true

      - name: Import test (sanity check)
        run: |
          python -c "import main"

      - name: Run tests (if available)
        run: |
          if [ -d "tests" ]; then pytest; else echo "No tests found"; fi

  # =========================
  # 2. Frontend (Flutter)
  # =========================
  frontend_flutter:
    name: Frontend (Flutter)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend_flutter

    steps:
      - uses: actions/checkout@v4

      - name: Validate structure
        run: |
          echo "Flutter structure:"
          ls -la

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.0"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: |
          if [ -d "test" ]; then flutter test; else echo "No tests"; fi

      - name: Build APK (CI artifact)
        run: flutter build apk --debug


  # =========================
  # 3. CI Summary Gate
  # =========================
  quality_gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [backend, frontend_flutter]

    steps:
      - name: Success
        run: echo "All checks passed. CI is healthy."
