name: Full CI Pipeline

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # =========================
  # 1. Backend (FastAPI)
  # =========================
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Validate structure
        run: |
          echo "Backend structure:"
          ls -la

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio

      - name: Lint (optional but recommended)
        run: |
          pip install flake8
          flake8 . || true

      - name: Import test (sanity check)
        env:
          OPENROUTER_API_KEY: "sk-dummy-key-for-ci"
          OPENAI_API_KEY: "sk-dummy-key-for-ci"
          OPENROUTER_BASE_URL: "https://openrouter.ai/api/v1"
          OPENROUTER_MODEL: "google/gemini-2.0-flash-001"
          DATABASE_URL: "sqlite:///./test.db"
        run: |
          python -c "import app.main"

      - name: Run tests (if available)
        env:
          PYTHONPATH: .
        run: |
          if [ -d "tests" ]; then pytest; else echo "No tests found"; fi

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:latest

  # =========================
  # 2. Frontend (Flutter)
  # =========================
  frontend_flutter:
    name: Frontend (Flutter)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend_flutter

    steps:
      - uses: actions/checkout@v4

      - name: Validate structure
        run: |
          echo "Flutter structure:"
          ls -la

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.0"

      - name: Clean Flutter project
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: |
          if [ -d "test" ]; then flutter test; else echo "No tests"; fi

      - name: Build APK (CI artifact)
        run: flutter build apk --debug


  # =========================
  # 3. CI Summary Gate
  # =========================
  quality_gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [backend, frontend_flutter]

    steps:
      - name: Success
        run: echo "All checks passed. CI is healthy."
